<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUTO STORE</title>
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0088ff">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            user-select: none;
        }
        h1 {
            text-align: center;
            color: #0088ff;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn.active {
            background-color: #0088ff;
            border-color: #0088ff;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }
        .game-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
            text-align: center;
            padding-bottom: 10px;
        }
        .game-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #2a2a2a;
        }
        .game-title {
            font-size: 14px;
            font-weight: bold;
            margin: 8px 5px 4px 5px;
        }
        .game-code {
            display: inline-block;
            font-size: 11px;
            color: #0088ff;
            border: 1px solid #0088ff;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        .download-btn {
            display: block;
            width: 80%;
            margin: 0 auto;
            padding: 6px 0;
            background-color: transparent;
            border: 1px solid #0088ff;
            color: #0088ff;
            border-radius: 5px;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <h1>MUTO STORE</h1>
    <p class="subtitle">Oyun Arşivi (%100 Çevrimdışı)</p>

    <div class="tabs">
        <button class="tab-btn active">PS3</button>
        <button class="tab-btn">PS2</button>
        <button class="tab-btn">PS1</button>
    </div>

    <div class="game-grid">
        <div class="game-card">
            <img src="kapaklar/gta_v.jpg" alt="GTA V">
            <div class="game-title">Grand Theft Auto V</div>
            <span class="game-code">BLUS31156</span>
            <a href="#" class="download-btn">İndir</a>
        </div>
        <div class="game-card">
            <img src="kapaklar/fifa_17.jpg" alt="FIFA 17">
            <div class="game-title">FIFA 17</div>
            <span class="game-code">BLES02235</span>
            <a href="#" class="download-btn">İndir</a>
        </div>
        <div class="game-card">
            <img src="kapaklar/the_last_of_us.jpg" alt="TLOU">
            <div class="game-title">The Last of Us</div>
            <span class="game-code">BCUS98174</span>
            <a href="#" class="download-btn">İndir</a>
        </div>
        <div class="game-card">
            <img src="kapaklar/god_of_war_iii.jpg" alt="GOW3">
            <div class="game-title">God of War III</div>
            <span class="game-code">BCUS98111</span>
            <a href="#" class="download-btn">İndir</a>
        </div>
    </div>

</body>
</html>
