<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUTO STORE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; text-align: center; }
        h1 { color: #00d2ff; margin-bottom: 5px; font-size: 26px; font-weight: 800; letter-spacing: 1px; }
        p.subtitle { color: #8892b0; font-size: 13px; margin-bottom: 20px; }
        
        .tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .tab-btn { background: #172a45; border: 1px solid #303c55; color: #8892b0; padding: 10px 18px; border-radius: 10px; font-weight: bold; cursor: pointer; flex: 1; max-width: 100px; transition: 0.2s; }
        .tab-btn.active { background: #00d2ff; color: #0b0f19; border-color: #00d2ff; box-shadow: 0 0 15px rgba(0,210,255,0.4); }

        .game-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .card { background: #112240; border-radius: 12px; padding: 12px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #233554; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        /* Şık Konsol Kapak Kutusu */
        .card-cover { width: 100%; height: 140px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,0.6); margin-bottom: 10px; }
        .ps3-cover { background: linear-gradient(135deg, #0052D4, #4364F7, #6FB1FC); color: #fff; }
        .ps2-cover { background: linear-gradient(135deg, #141e30, #243b55); color: #00d2ff; border: 1px solid #00d2ff33; }
        .ps1-cover { background: linear-gradient(135deg, #2c3e50, #4ca1af); color: #fff; }
        
        .card-cover span.console-badge { font-size: 11px; background: rgba(0,0,0,0.4); padding: 3px 8px; border-radius: 20px; margin-bottom: 6px; letter-spacing: 1px; }
        .card-cover span.game-initials { font-size: 18px; padding: 0 10px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

        .card-info { margin-top: 4px; }
        .card-title { font-size: 13px; font-weight: bold; color: #e6f1ff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-code { font-size: 10px; color: #64ffda; background: rgba(100,255,218,0.1); padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
        .btn-download { display: block; text-align: center; background: transparent; border: 1px solid #64ffda; color: #64ffda; text-decoration: none; padding: 6px 0; border-radius: 6px; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .btn-download:active { background: #64ffda; color: #0b0f19; }
    </style>
</head>
<body>

    <h1>MUTO STORE</h1>
    <p class="subtitle" id="subTitle">Dev Oyun Arşivi (100 Oyun)</p>

    <div class="tabs">
        <button class="tab-btn active" onclick="filterCategory('ps3', this)">PS3</button>
        <button class="tab-btn" onclick="filterCategory('ps2', this)">PS2</button>
        <button class="tab-btn" onclick="filterCategory('ps1', this)">PS1</button>
    </div>

    <div class="game-list" id="gamesContainer"></div>

    <script>
        const ps3Games = [
            "Grand Theft Auto V", "Gran Turismo 6", "FIFA 17", "The Last of Us", "God of War III",
            "Red Dead Redemption", "Uncharted 2", "Uncharted 3", "PES 2013", "Tekken 6",
            "Need for Speed Most Wanted", "Batman Arkham City", "Assassin's Creed IV", "Call of Duty BO2", "Far Cry 3",
            "Battlefield 4", "Mortal Kombat Komplete", "Naruto Storm 3", "Resident Evil 6", "Devil May Cry 4",
            "Minecraft", "FIFA 19 Mod", "Blur", "Driver San Francisco", "Dark Souls II",
            "Mafia II", "Max Payne 3", "Watch Dogs", "WWE 2K17", "FIFA Street", "NBA 2K17",
            "Need for Speed Rivals", "Metal Gear Solid V", "LittleBigPlanet 2", "Injustice",
            "Borderlands 2", "Dead Space", "BioShock Infinite", "Crysis 3", "Tomb Raider",
            "Dishonored", "Infamous 2", "Prototype 2", "Rayman Legends", "L.A. Noire",
            "Midnight Club LA", "Fight Night Champion", "Dragon Ball Xenoverse", "Castlevania Lords of Shadow", "Darksiders II"
        ];

        const ps2Games = [
            "GTA San Andreas", "GTA Vice City", "God of War II", "God of War", "Need for Speed Most Wanted",
            "PES 2014", "Tekken 5", "Resident Evil 4", "Bully", "Mortal Kombat Shaolin Monks",
            "Devil May Cry 3", "Shadow of the Colossus", "Dragon Ball Z BT3", "Def Jam Fight for NY", "Burnout 3 Takedown",
            "Need for Speed Underground 2", "Call of Duty 3", "Silent Hill 2", "Black", "Final Fantasy X",
            "Gran Turismo 4", "Metal Gear Solid 3", "Crash Mind over Mutant", "Hitman Blood Money", "WWE SmackDown HCTP"
        ];

        const ps1Games = [
            "Tekken 3", "Crash Bandicoot 3", "Resident Evil 3", "Winning Eleven 2002", "Crisis Beat",
            "Cadillacs and Dinosaurs", "Pepsiman", "Jackie Chan Stuntmaster", "Driver 2", "Metal Slug X",
            "Gran Turismo 2", "Mortal Kombat Trilogy", "Castlevania SOTN", "Dino Crisis 2", "Street Fighter Alpha 3",
            "Spider-Man", "Tom and Jerry", "Silent Hill", "Medal of Honor", "Tony Hawk's Pro Skater 2",
            "Bloody Roar 2", "Crash Team Racing", "Syphon Filter 2", "Twisted Metal 2", "Vigilante 8"
        ];

        function createGameList(arr, category, codePrefix) {
            return arr.map((name, index) => {
                return {
                    name: name,
                    code: `${codePrefix}${10000 + index}`,
                    cat: category,
                    link: "#"
                };
            });
        }

        const allGames = [
            ...createGameList(ps3Games, 'ps3', 'BLUS'),
            ...createGameList(ps2Games, 'ps2', 'SLUS'),
            ...createGameList(ps1Games, 'ps1', 'SCUS')
        ];

        function renderGames(category) {
            const container = document.getElementById('gamesContainer');
            container.innerHTML = '';
            
            const filtered = allGames.filter(g => g.cat === category);
            document.getElementById('subTitle').innerText = `${category.toUpperCase()} Arşivi (${filtered.length} Oyun)`;

            filtered.forEach(game => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-cover ${game.cat}-cover">
                        <span class="console-badge">${game.cat.toUpperCase()}</span>
                        <span class="game-initials">${game.name}</span>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${game.name}</div>
                        <span class="card-code">${game.code}</span>
                        <a href="${game.link}" class="btn-download">İndir</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGames(cat);
        }

        renderGames('ps3');
    </script>

</body>
</html>
